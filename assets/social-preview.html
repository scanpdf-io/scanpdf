<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1280px; height:640px; }
  body {
    background:#12151b;
    color:#e8ecf1;
    font: 400 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow:hidden;
  }
  .wrap {
    position:relative; width:1280px; height:640px;
    display:flex; align-items:center; gap:56px;
    padding:0 80px;
  }
  .glow {
    position:absolute; inset:0;
    background:
      radial-gradient(620px 420px at 78% 30%, rgba(77,163,255,0.16), transparent 70%),
      radial-gradient(520px 380px at 12% 92%, rgba(98,201,138,0.11), transparent 70%);
  }
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size:40px 40px;
    mask-image: radial-gradient(760px 520px at 50% 45%, #000 40%, transparent 100%);
  }
  .left { position:relative; width:660px; }

  .brand { display:flex; align-items:center; gap:20px; margin-bottom:34px; }
  .mark { width:76px; height:76px; display:block; }
  h1 { font-size:60px; font-weight:700; letter-spacing:-1.2px; line-height:1; }
  h1 .io { color:#4da3ff; }

  .tag {
    font-size:27px; line-height:1.36; font-weight:400; color:#c3ccd8;
    letter-spacing:-0.2px; margin-bottom:14px;
  }
  .tag b { color:#e8ecf1; font-weight:600; }

  .sub { font-size:20px; color:#7d8b9b; letter-spacing:-0.1px; margin-bottom:34px; }

  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:36px; }
  .chip {
    font-size:16.5px; color:#a9b6c5; padding:8px 15px;
    border:1px solid #2e3745; border-radius:999px; background:#1a1f27;
  }
  .chip.acc { color:#8cc8ff; border-color:#25456b; background:rgba(77,163,255,0.09); }
  .chip.grn { color:#87d7a6; border-color:#27553c; background:rgba(98,201,138,0.09); }

  .url { display:flex; align-items:center; gap:12px; font-size:22px; color:#e8ecf1; font-weight:600; }
  .url .dot { width:9px; height:9px; border-radius:50%; background:#62c98a; box-shadow:0 0 12px rgba(98,201,138,0.9); }
  .url .lic { font-weight:400; font-size:18px; color:#6f7d8d; margin-left:6px; }

  .right { position:relative; width:400px; height:440px; }
</style>

<div class="wrap">
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="left">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32">
        <rect width="32" height="32" fill="#1a1f27" stroke="#2e3745" stroke-width="1"/>
        <path d="M11 6.5h7L23 11.5v13a1.5 1.5 0 0 1-1.5 1.5H11A1.5 1.5 0 0 1 9.5 24.5V8A1.5 1.5 0 0 1 11 6.5z" fill="none" stroke="#4da3ff" stroke-width="1.9" stroke-linejoin="round"/>
        <path d="M18 6.5V11.5H23" fill="none" stroke="#4da3ff" stroke-width="1.9" stroke-linejoin="round"/>
        <line x1="6.5" y1="17" x2="25.5" y2="17" stroke="#62c98a" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
      <h1>Scan<span class="io">PDF</span></h1>
    </div>

    <div class="tag">Photos of paper documents →<br><b>clean, flatbed-quality PDFs</b></div>
    <div class="sub">No accounts. No uploads. No server — it all runs in your browser.</div>

    <div class="chips">
      <div class="chip acc">Auto corner detection</div>
      <div class="chip">Perspective correction</div>
      <div class="chip">Scan filters</div>
      <div class="chip">Multi-page PDF</div>
      <div class="chip grn">100% offline</div>
    </div>

    <div class="url"><span class="dot"></span>scanpdf.io<span class="lic">· MIT · self-hostable</span></div>
  </div>

  <div class="right">
    <svg viewBox="0 0 400 440" width="400" height="440">
      <defs>
        <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#e6ebf1"/>
        </linearGradient>
        <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#3d4756"/>
          <stop offset="1" stop-color="#232a35"/>
        </linearGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#62c98a" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#62c98a" stop-opacity="1"/>
          <stop offset="1" stop-color="#62c98a" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="pageClip">
          <rect x="150" y="96" width="228" height="296" rx="6"/>
        </clipPath>
      </defs>

      <!-- back: skewed phone photo of a document -->
      <g opacity="0.95">
        <path d="M32 118 L188 74 L214 356 L52 396 Z" fill="url(#photo)" stroke="#394453" stroke-width="2"/>
        <path d="M52 148 L166 116 L169 148 L55 180 Z" fill="#4b5666" opacity="0.55"/>
        <g stroke="#616d7d" stroke-width="5" stroke-linecap="round" opacity="0.75">
          <line x1="56" y1="206" x2="176" y2="174"/>
          <line x1="59" y1="236" x2="180" y2="204"/>
          <line x1="62" y1="266" x2="150" y2="243"/>
          <line x1="65" y1="296" x2="183" y2="264"/>
          <line x1="68" y1="326" x2="140" y2="307"/>
        </g>
        <!-- detected corner handles -->
        <g fill="#12151b" stroke="#4da3ff" stroke-width="4">
          <circle cx="32" cy="118" r="10"/>
          <circle cx="188" cy="74" r="10"/>
          <circle cx="214" cy="356" r="10"/>
          <circle cx="52" cy="396" r="10"/>
        </g>
        <path d="M32 118 L188 74 L214 356 L52 396 Z" fill="none" stroke="#4da3ff" stroke-width="3" stroke-dasharray="10 8" opacity="0.9"/>
      </g>

      <!-- front: clean flat page -->
      <g>
        <rect x="150" y="96" width="228" height="296" rx="6" fill="url(#paper)"/>
        <rect x="150" y="96" width="228" height="296" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
        <g clip-path="url(#pageClip)">
          <rect x="176" y="128" width="120" height="16" rx="4" fill="#12151b" opacity="0.82"/>
          <g fill="#12151b" opacity="0.34">
            <rect x="176" y="168" width="176" height="9" rx="4.5"/>
            <rect x="176" y="190" width="176" height="9" rx="4.5"/>
            <rect x="176" y="212" width="140" height="9" rx="4.5"/>
            <rect x="176" y="248" width="176" height="9" rx="4.5"/>
            <rect x="176" y="270" width="176" height="9" rx="4.5"/>
            <rect x="176" y="292" width="176" height="9" rx="4.5"/>
            <rect x="176" y="314" width="102" height="9" rx="4.5"/>
          </g>
          <rect x="176" y="348" width="64" height="9" rx="4.5" fill="#4da3ff" opacity="0.5"/>
          <!-- scan beam -->
          <rect x="150" y="228" width="228" height="3" fill="url(#beam)"/>
          <rect x="150" y="231" width="228" height="46" fill="#62c98a" opacity="0.10"/>
        </g>
      </g>
    </svg>
  </div>
</div>
