<!DOCTYPE html>
<html lang="{{lang}}">
<head>
{{{head}}}
<link rel="stylesheet" href="{{base}}css/tokens.css">
<link rel="stylesheet" href="{{base}}css/app.css">
{{{jsonld}}}
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-logo" aria-hidden="true">&#9636;</div>
    <div class="brand-text">
      <h1>ScanPDF</h1>
      <p class="tagline">{{appTagline}}</p>
    </div>
  </div>
  <div class="topbar-controls">
    <span id="engine-status" class="engine-status" hidden></span>
    <label class="field">
      <span>{{appPageSizeLabel}}</span>
      <select id="page-format">
        <option value="a4" selected>A4</option>
        <option value="letter">Letter</option>
        <option value="auto">{{appPageSizeAuto}}</option>
      </select>
    </label>
    <button id="save-btn" class="btn primary" disabled>{{appSavePdf}}</button>
    <a class="github-link" href="https://github.com/scanpdf-io/scanpdf" target="_blank" rel="noopener" title="{{appGithubTitle}}">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      <span>GitHub</span>
    </a>
  </div>
</header>

<main class="layout">
  <aside class="sidebar">
    <div class="add-buttons">
      <button id="add-btn" class="btn add-btn"><span class="btn-icon" aria-hidden="true">&#65291;</span><span class="btn-label">{{appAddPhotos}}</span></button>
      <button id="camera-btn" class="btn add-btn camera-btn">
        <span class="btn-icon"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
        <span class="btn-label">{{appTakePhoto}}</span>
      </button>
    </div>
    <div id="pages-list" class="pages-list"></div>
  </aside>

  <div id="view-toggle" class="view-toggle" hidden>
    <button id="view-editor-btn" class="seg active" type="button">{{appViewEditor}}</button>
    <button id="view-preview-btn" class="seg" type="button">{{appViewPreview}}</button>
  </div>

  <section class="editor-pane">
    <div class="toolbar" id="page-toolbar" hidden>
      <button id="rotate-ccw" class="btn icon" title="{{appRotateLeftTitle}}" aria-label="{{appRotateLeftTitle}}">&#10226;</button>
      <button id="rotate-cw" class="btn icon" title="{{appRotateRightTitle}}" aria-label="{{appRotateRightTitle}}">&#10227;</button>
      <span class="sep"></span>
      <label class="field">
        <span>{{appFilterLabel}}</span>
        <select id="filter-select">
          <option value="color">{{appFilterColor}}</option>
          <option value="gray">{{appFilterGray}}</option>
          <option value="bw">{{appFilterBw}}</option>
        </select>
      </label>
      <button id="filter-all" class="btn" title="{{appApplyToAllTitle}}">{{appApplyToAll}}</button>
      <span class="sep"></span>
      <button id="redetect-btn" class="btn" title="{{appRedetectTitle}}">{{appRedetect}}</button>
      <button id="reset-corners-btn" class="btn" title="{{appResetCornersTitle}}">{{appResetCorners}}</button>
    </div>
    <div class="editor-wrap" id="editor-wrap">
      <div id="dropzone" class="dropzone">
        <div class="dropzone-inner">
          <div class="dz-icon" aria-hidden="true">&#10515;</div>
          <p class="dz-title">{{appDropTitle}}</p>
          <p class="dz-sub">{{appDropSub}}</p>
        </div>
      </div>
      <canvas id="editor-canvas" hidden></canvas>
    </div>
    <p class="editor-hint" id="editor-hint" hidden>{{appEditorHint}}</p>
  </section>

  <aside class="preview-pane">
    <h2>{{appPreviewTitle}}</h2>
    <div class="preview-wrap"><canvas id="preview-canvas"></canvas></div>
    <p class="preview-hint">{{appPreviewHint}}</p>
  </aside>
</main>

{{{footer}}}

<div id="export-overlay" class="overlay" hidden>
  <div class="overlay-card">
    <p id="export-status">{{appExporting}}</p>
    <div class="progress"><div id="export-bar" class="progress-bar"></div></div>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" multiple hidden>
<input type="file" id="camera-input" accept="image/*" capture="environment" hidden>

<!-- Strings needed by the JS modules. An inline <script> would be blocked by
     the container's script-src 'self' CSP, so they travel as data attributes. -->
<div id="i18n" hidden{{{uiStrings}}}></div>

<script src="{{base}}vendor/pdf-lib.min.js" defer></script>
<script type="module" src="{{base}}js/main.js"></script>
</body>
</html>
