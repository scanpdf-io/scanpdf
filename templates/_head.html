<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{{hreflang}}}
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#12151b">
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="ScanPDF">
<meta property="og:url" content="{{canonical}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{ogDescription}}">
<meta property="og:image" content="{{origin}}/og/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="{{ogImageAlt}}">
<meta property="og:locale" content="{{ogLocale}}">
{{{ogLocaleAlternates}}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ogTitle}}">
<meta name="twitter:description" content="{{ogDescription}}">
<meta name="twitter:image" content="{{origin}}/og/social-preview.png">
<meta name="twitter:image:alt" content="{{ogImageAlt}}">
<link rel="icon" href="{{base}}favicon.svg" type="image/svg+xml">
<link rel="icon" href="{{base}}icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="{{base}}icons/icon-180.png">
<link rel="manifest" href="{{manifestHref}}">
